services:
  next-stt:
    image: next-stt:latest
    environment:
      NODE_ENV: production
    env_file:
      - ${ENV_FILE}
    container_name: next-stt
    ports:
      - "${HOST_PORT:-3000}:3000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3